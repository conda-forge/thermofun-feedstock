{% set version = "0.7.0" %}

# autodiff has no conda package for python 3.15, linux-aarch64 or linux-ppc64le.
# When it gets one, remove that case from the line below.
{% set has_autodiff = true %}
{% set has_autodiff = false %}  # [py>=315 or aarch64 or ppc64le]

package:
  name: thermofun
  version: {{ version }}

source:
  url: https://github.com/thermomod/thermofun/archive/v{{ version }}.tar.gz
  sha256: a90ad90a344fa12b74143c2e364a8f637c3c1044b4d549d8c37d3123dab1debe

  #git_url: https://dmiron@bitbucket.org/gems4/thermofun.git
  #git_rev: test-17

  #git_url: https://github.com/thermohub/thermofun.git
  #git_rev: gdmiron-patch-1

build:
  number: 1
#  skip: True  # [py2k or osx or c_compiler == 'toolchain_c']
  skip: true  # [win and vc<14]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - cmake
    - ninja  # [win]
    - make   # [unix]
    - python  # [win or osx]
    - pip  # [win or osx]
    - setuptools  # [win or osx]
    - wheel  # [win or osx]

  host:
    - python
    - pip
    - setuptools
    - wheel
    - pybind11
    - chemicalfun >=0.1.13
    {% if has_autodiff %}
    - autodiff >=1.1.1
    {% endif %}
    - spdlog
    - nlohmann_json >=3.7.0

  run:
    - python
    - chemicalfun >=0.1.13
    {% if has_autodiff %}
    - autodiff >=1.1.1
    {% endif %}
    - spdlog
    - nlohmann_json >=3.7.0

test:
  imports:
    - thermofun

about:
  home: https://thermohub.org/thermofun/thermofun/
  license: LGPL-3.0-only
  license_family: LGPL
  license_file: LICENSE
  summary: Standalone library for calculating temperature and pressure corrections of thermodynamic data for substances and reactions.
  doc_url: https://thermohub.org/thermofun/thermofun/
  dev_url: https://github.com/thermomod/thermofun

extra:
  recipe-maintainers:
    - gdmiron
    - allanleal
    - sdmytrievs
